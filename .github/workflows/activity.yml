name: Activity grid

on:
  schedule:
    - cron: "17 19 * * *" # 02:17 ICT, once a day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/activity.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the contribution grid in KhanhCloud colours
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/activity-light.svg?color_snake=#252026&color_dots=#e6e1d6,#e5f481,#c2cc63,#8a8a3c,#575126
            dist/activity-dark.svg?color_snake=#e5f481&color_dots=#2f2a30,#4a4520,#6f6a2e,#a7b34a,#e5f481

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
